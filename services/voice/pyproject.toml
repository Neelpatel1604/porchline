[project]
name = "porchline-voice"
version = "0.1.0"
description = "Porchline phone agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pipecat-ai>=1.4.0,<1.13",
  "pipecat-boson>=0.1.3",
  "twilio>=9.0",
  "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["porchline_voice*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
